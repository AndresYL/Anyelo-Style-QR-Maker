name: Crear programa para Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Pruebas automaticas
        shell: bash
        run: python -m pytest -q

      - name: Crear el exe
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --windowed --name AnyeloStyleQR \
            --icon anyelo_qr/assets/icon.ico \
            --add-data "anyelo_qr/assets;anyelo_qr/assets" \
            --collect-all pypdfium2 --collect-all pypdfium2_raw --collect-all zxingcpp \
            --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets \
            main.py

      - name: Comprimir
        shell: pwsh
        run: Compress-Archive -Path dist/AnyeloStyleQR -DestinationPath AnyeloStyleQR-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AnyeloStyleQR-Windows
          path: AnyeloStyleQR-Windows.zip
          retention-days: 30
