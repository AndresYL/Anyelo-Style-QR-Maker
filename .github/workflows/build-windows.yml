name: Crear programa para Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Pruebas automaticas
        shell: bash
        run: python -m pytest -q

      - name: Leer la version
        id: ver
        shell: bash
        run: echo "v=$(python -c "from anyelo_qr.brand import VERSION; print(VERSION)")" >> "$GITHUB_OUTPUT"

      - name: Crear el exe
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --windowed --name AnyeloStyleQR \
            --icon anyelo_qr/assets/icon.ico \
            --add-data "anyelo_qr/assets;anyelo_qr/assets" \
            --collect-all pypdfium2 --collect-all pypdfium2_raw --collect-all zxingcpp \
            --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets \
            main.py

      - name: Version portable
        shell: pwsh
        run: Compress-Archive -Path dist/AnyeloStyleQR -DestinationPath AnyeloStyleQR-Portable.zip

      - name: Crear el instalador
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc).Source }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.v }}" installer\AnyeloStyleQR.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC fallo con codigo $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: AnyeloStyleQR-Windows
          path: |
            AnyeloStyleQR-Portable.zip
            installer/Output/AnyeloStyleQR-Setup.exe
          retention-days: 30

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Anyelo Style QR ${{ steps.ver.outputs.v }}
          files: |
            installer/Output/AnyeloStyleQR-Setup.exe
            AnyeloStyleQR-Portable.zip
